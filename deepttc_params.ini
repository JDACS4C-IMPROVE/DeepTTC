[Preprocess]
train_split_file = CCLE_split_0_train.txt
val_split_file = CCLE_split_0_val.txt
test_split_file = CCLE_split_0_test.txt
data_format = .h5
y_data_file = response.tsv
cell_transcriptomic_file = cancer_gene_expression.tsv
cell_transcriptomic_transform = [['subset', 'LINCS_SYMBOL'], ['scale', 'std']]
drug_smiles_file = drug_SMILES.tsv
drug_mordred_transform = [['scale', 'std']]
input_supp_data_dir = ./author_data
sample_id = COSMIC_ID

[Train]
data_format = .h5
model_file_name = model
model_file_format = .pt
epochs = 300
patience = 10
batch_size = 64
val_batch = 256
loss = mse
early_stop_metric = mse
ckpt_save_interval = 5
log_interval = 20
cuda_name = cuda:0
rng_seed=1
input_dim_drug = 2586
transformer_emb_size_drug = 128
dropout = 0.1
transformer_n_layer_drug = 8
transformer_intermediate_size_drug = 512
transformer_num_attention_heads_drug = 8
transformer_attention_probs_dropout = 0.1
transformer_hidden_dropout_rate = 0.1
learning_rate = 1e-5
input_dim_drug_classifier = 128
input_dim_gene_classifier = 256

[Infer]
input_data_dir = ./ml_data
output_dir = ./ml_data
data_format = .h5
test_batch = 256
input_model_dir = ./ml_data
cuda_name = cuda:0
input_dim_drug = 2586
transformer_emb_size_drug = 128
dropout = 0.1
transformer_n_layer_drug = 8
transformer_intermediate_size_drug = 512
transformer_num_attention_heads_drug = 8
transformer_attention_probs_dropout = 0.1
transformer_hidden_dropout_rate = 0.1
learning_rate = 1e-5
input_dim_drug_classifier = 128
input_dim_gene_classifier = 256